<title>Weiwei's AI Hub</title>

<body>
<style>
/* Layout: warm line-art infographic style. Cream slides on a deeper cream ground, dark-brown outlines,
   stacked pastel pill headings, gray 01/02/03 numerals, outlined cards with hard offset shadows.
   Sidebar of tools on the left; Today = stacked-pill greeting, daily line, notes, a timeline with one stop per tool.
   Tool page = tinted title card beside outlined step cards; buttons are brown pills. */
:root {
  --ground: #e8e1d0;
  --slide: #f4f0e6;
  --paper: #fffdf7;
  --ink: #45301a;
  --on-ink: #fbf6ea;
  --text: #15110c;
  --muted: #6a5e4a;
  --line: #d8cdb5;
  --grid: rgba(69, 48, 26, .11);
  --numgray: #8f8776;
  --cream: #f8e9cc;
  --pink: #f6cde3;
  --blue: #c3d3dd;
  --green: #bddb98;
  --butter: #fecd4b;
  --sky: #dde9f1;
  --head: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15110b; --slide: #1f1a12; --paper: #2a2318; --ink: #e8d9bb; --on-ink: #1f1a12; --text: #f5eedd;
    --muted: #b0a389; --line: #3b3124; --grid: rgba(232, 217, 187, .08); --numgray: #8a7f6a;
    --cream: #5a4a26; --pink: #6a4458; --blue: #3c5666; --green: #4c6531; --butter: #7a5c10; --sky: #2f4350;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #15110b; --slide: #1f1a12; --paper: #2a2318; --ink: #e8d9bb; --on-ink: #1f1a12; --text: #f5eedd;
  --muted: #b0a389; --line: #3b3124; --grid: rgba(232, 217, 187, .08); --numgray: #8a7f6a;
  --cream: #5a4a26; --pink: #6a4458; --blue: #3c5666; --green: #4c6531; --butter: #7a5c10; --sky: #2f4350;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--body); font-size: 14.5px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--slide); }
h1, h2, h3 { font-family: var(--head); margin: 0; color: var(--text); text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::placeholder { color: var(--muted); opacity: .85; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }

/* Sidebar */
.side { background: var(--slide); border-right: 2.5px solid var(--ink); padding: 26px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px; }
.logo { width: 46px; height: 46px; border-radius: 50%; background: var(--butter); border: 2.5px solid var(--ink); display: grid; place-items: center; flex: none; position: relative; color: var(--ink); }
.logo::after { content: ""; position: absolute; right: -5px; top: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); border: 2.5px solid var(--ink); }
.logo svg { width: 22px; height: 22px; }
.brand b { font-weight: 800; font-size: 16px; display: block; line-height: 1.2; color: var(--text); }
.brand span { font-size: 12px; color: var(--muted); }
.navgroup { display: grid; gap: 6px; }
.navlabel { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); padding: 0 10px 4px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid transparent; background: none; padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.nav:hover { background: var(--paper); border-color: var(--ink); }
.nav[aria-current="page"] { background: var(--c); border-color: var(--ink); font-weight: 700; box-shadow: 2px 3px 0 var(--ink); }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--c); border: 2px solid var(--ink); color: var(--ink); }
.dot svg { width: 17px; height: 17px; }
.nav[aria-current="page"] .dot { background: var(--paper); }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 10px; }

/* Main and slides */
.main { padding: 30px clamp(16px, 4vw, 44px) 56px; display: grid; gap: 24px; align-content: start; min-width: 0; max-width: 1100px; }
.slide { background: var(--slide); border: 1.5px solid var(--line); border-radius: 28px; padding: clamp(20px, 3.6vw, 36px); position: relative; overflow: hidden; min-width: 0; }
.slide > * { position: relative; }
.gridbg { background-image: linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px); background-size: 42px 42px; }
.sparkle { position: absolute !important; width: 84px; height: 84px; color: var(--ink); pointer-events: none; right: 28px; top: 22px; }
.deco { position: absolute !important; pointer-events: none; border: 2px solid var(--ink); }
.deco.c1 { width: 14px; height: 14px; border-radius: 50%; right: 150px; bottom: 34px; }
.deco.p1 { width: 28px; height: 12px; border-radius: 999px; right: 96px; bottom: 62px; transform: rotate(-28deg); }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--ink); }
.eyebrow .sep { margin: 0 8px; }
.eyebrow b { color: var(--text); font-weight: 800; }
.lede { margin: 18px 0 0; font-weight: 600; font-size: clamp(14.5px, 1.6vw, 17px); max-width: 56ch; color: var(--text); }

/* Today hero */
.stackhead { margin: 18px 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.sp { display: inline-block; max-width: 100%; font-weight: 900; text-transform: uppercase; font-size: clamp(22px, 6.2vw, 62px); line-height: 1.12; letter-spacing: -.03em; color: var(--text); background: var(--f); border: 2.5px solid var(--ink); border-radius: 999px; padding: .06em .5em .08em; box-shadow: 0 7px 0 -1px var(--f), 0 8px 0 0 var(--ink); }
.sp-cream { --f: var(--cream); }
.sp-pink { --f: var(--pink); margin-left: clamp(18px, 7vw, 90px); transform: rotate(-1.5deg); }
.pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.pill { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 4px 15px; background: var(--paper); color: var(--text); border: 2px solid var(--ink); }
.pill.dark { background: var(--ink); color: var(--on-ink); }

/* Daily line and lift box */
.slide.quote { background-color: var(--cream); }
.quote { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 18px; align-items: start; }
.quote .dot { width: 56px; height: 56px; --c: var(--butter); border-width: 2.5px; }
.quote .dot svg { width: 25px; height: 25px; }
.quote p { margin: 6px 0 0; font-weight: 800; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.3; color: var(--text); }
.quote p.liftwhy { margin: 10px 0 0; font-weight: 500; font-size: 14px; }
.quote p.liftwhy:empty { display: none; }
.lift { margin-top: 18px; padding-top: 16px; border-top: 2px dotted color-mix(in srgb, var(--ink) 55%, transparent); }
.lift[hidden] { display: none; }
.lift label { display: block; font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 8px; }
.liftrow { display: flex; gap: 8px; flex-wrap: wrap; }
.liftrow input, .inlinenote input, .inlinenote select { font-size: 14.5px; color: var(--text); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 10px 18px; min-width: 0; }
.liftrow input { flex: 1 1 220px; }
.liftrow input:focus, .inlinenote input:focus, .inlinenote select:focus, .qnpanel textarea:focus { outline: none; box-shadow: 3px 4px 0 var(--ink); }
.liftbtn { font-weight: 700; font-size: 14px; color: var(--on-ink); background: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 10px 22px; }
.liftbtn:hover { background: var(--butter); color: var(--text); }
.liftbtn:disabled { opacity: .6; cursor: default; }
.liftreset { margin-left: 4px; background: none; border: 0; padding: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Timeline of tools */
.roadhead { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.roadhead h2 { display: inline-block; font-weight: 800; font-size: clamp(18px, 2.4vw, 24px); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 26px; box-shadow: 0 6px 0 -1px var(--cream), 0 7px 0 0 var(--ink); }
.roadhead span { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.roadwrap { margin: 14px 0 0; container-type: inline-size; }
.roadwrap > svg { display: block; width: 100%; height: auto; overflow: visible; }
@container (max-width: 640px) { .roadwrap > svg { display: none; } }
.stop { cursor: pointer; }
.stop .callout { transition: transform .15s; }
.stop:hover .callout, .stop:focus-visible .callout { transform: translate(-2px, -2px); }
.stop:focus { outline: none; }
.stop:focus-visible .callout { stroke-width: 4; }
.calltxt { font: 700 14.5px var(--body); fill: var(--text); }
.nodetxt { font: 800 15px var(--body); fill: var(--on-ink); }
.stops { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 18px; margin-top: 16px; }
.stopcard { border: 0; background: none; text-align: left; padding: 12px 0 0; display: grid; gap: 2px; align-content: start; border-top: 2px dotted color-mix(in srgb, var(--ink) 45%, transparent); }
.stopcard .num { font-weight: 800; font-size: 30px; color: var(--numgray); line-height: 1; }
.stopcard b { font-weight: 700; font-size: 14px; color: var(--ink); }
.stopcard span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.stopcard:hover b { text-decoration: underline; text-underline-offset: 3px; }

/* Tool page */
.toolslide { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: center; }
.titlecard { background: var(--c); border: 2.5px solid var(--ink); border-radius: 36px; box-shadow: 6px 7px 0 var(--ink); padding: 28px 24px; text-align: center; }
.titlecard .dot { width: 62px; height: 62px; margin: 0 auto 12px; background: var(--paper); }
.titlecard .dot svg { width: 28px; height: 28px; }
.titlecard h1 { font-weight: 900; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.12; letter-spacing: -.01em; }
.titlecard p { margin: 10px 0 0; font-size: 13.5px; font-weight: 500; }
.zone { display: block; font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.lede.tool { margin: 0 0 22px; font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.steps li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; }
.steps .num { font-weight: 800; font-size: 34px; color: var(--numgray); line-height: 1; }
.stepcard { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 24px; padding: 14px 18px; margin-right: 6px; box-shadow: 5px 6px 0 -1px var(--paper), 5px 6px 0 1px var(--ink); }
.stepcard .dot { width: 46px; height: 46px; }
.stepcard .dot svg { width: 21px; height: 21px; }
.stepcard b { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }
.stepcard span { font-size: 13px; line-height: 1.5; }

.duo { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; }
.openslide { background: var(--sky); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.openbtn { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 15px; padding: 8px 8px 8px 22px; border-radius: 999px; border: 2px solid var(--ink); }
.openbtn i { width: 32px; height: 32px; border-radius: 50%; background: var(--butter); color: var(--text); display: grid; place-items: center; font-style: normal; font-size: 15px; }
.openbtn:hover { box-shadow: 3px 4px 0 color-mix(in srgb, var(--ink) 40%, transparent); }
.samplebtn { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); background: var(--paper); border: 2px solid var(--ink); font-weight: 700; font-size: 15px; padding: 8px 8px 8px 20px; border-radius: 999px; }
.samplebtn i { width: 32px; height: 32px; border-radius: 50%; background: var(--cream); border: 2px solid var(--ink); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.samplebtn:hover { background: var(--butter); }
.whenslide { background: var(--butter); border: 2.5px solid var(--ink); box-shadow: 5px 6px 0 var(--ink); }
.whenslide h3 { font-weight: 800; font-size: 16px; }
.whenslide p { margin: 8px 0 0; font-weight: 500; }

/* Page frame: byline, footer */
.maincol { min-width: 0; display: flex; flex-direction: column; }
.byline { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; max-width: 1100px; box-sizing: border-box; padding: 18px clamp(16px, 4vw, 44px) 0; }
.byline a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-size: 13px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px 5px 12px; box-shadow: 2px 3px 0 var(--ink); }
.byline a svg { color: #0A66C2; }
.byline a svg.gh { color: var(--ink); }
.byline a b { font-weight: 700; }
.byline a i { font-style: normal; color: var(--ink); font-weight: 700; }
.byline a:hover { background: var(--butter); }
.byline + .main { padding-top: 14px; }
.sitefoot { margin: 0 clamp(16px, 4vw, 44px) 32px; max-width: 1100px; box-sizing: border-box; padding: 14px 24px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; font-size: 13.5px; text-align: center; }
.libtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 15px; border-radius: 999px; background: var(--on-ink); color: var(--ink); font-weight: 700; text-decoration: none; }
.libtn:hover { background: var(--butter); color: var(--text); }

/* Quick notes */
.navcount { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--butter); color: var(--text); border: 2px solid var(--ink); font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
.navcount[hidden] { display: none; }
.stopcard b .navcount { margin-left: 6px; vertical-align: 1px; }
body.hasnotes .maincol { padding-bottom: 76px; }
.qnfab { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 14.5px; padding: 6px 18px 6px 6px; border-radius: 999px; box-shadow: 4px 5px 0 color-mix(in srgb, var(--ink) 35%, transparent); }
.qnfab i { width: 34px; height: 34px; border-radius: 50%; background: var(--butter); color: var(--text); display: grid; place-items: center; font-style: normal; font-size: 22px; line-height: 1; }
.qnfab:hover { filter: brightness(1.15); }
.qnfab[hidden], .qnpanel[hidden] { display: none; }
.qnpanel { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow-y: auto; box-sizing: border-box; padding: 20px; border-radius: 28px; background: var(--slide); border: 2.5px solid var(--ink); box-shadow: 6px 7px 0 var(--ink); }
.qnhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.qnhead h2 { font-weight: 800; font-size: 18px; }
.qnclose { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 18px; line-height: 1; }
.qnsub { margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
.qnpanel textarea { width: 100%; box-sizing: border-box; min-height: 96px; resize: vertical; font-size: 15px; color: var(--text); background: var(--paper); border: 2px solid var(--ink); border-radius: 20px; padding: 12px 14px; }
.qnlabel { margin: 12px 0 6px; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.qnchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qnchip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--paper); color: var(--text); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; }
.qnchip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--butter)); border: 1.5px solid var(--ink); }
.qnchip[aria-pressed="true"] { background: var(--c, var(--butter)); font-weight: 700; box-shadow: 2px 3px 0 var(--ink); }
.qnadd { margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink); background: var(--blue); color: var(--text); font-weight: 700; font-size: 15px; padding: 11px 18px; border-radius: 999px; }
.qnadd b { font-size: 20px; line-height: 1; color: var(--ink); }
.qnadd:hover { background: var(--butter); }
.qnadd:disabled { opacity: .6; cursor: default; }
.qnmsg { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); min-height: 1em; }
.qnmsg button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.noteshead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.noteshead h3 { display: inline-block; font-weight: 800; font-size: 16px; background: var(--c, var(--cream)); border: 2.5px solid var(--ink); border-radius: 999px; padding: 5px 22px; margin-bottom: 6px; box-shadow: 0 5px 0 -1px var(--c, var(--cream)), 0 6px 0 0 var(--ink); }
.noteshead span { font-size: 13px; color: var(--muted); }
.notesslide[hidden] { display: none; }
.notelist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.notelist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 16px; border-radius: 22px; background: var(--paper); border: 2px solid var(--ink); }
.notecheck { width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--ink); background: none; padding: 0; }
.notecheck:hover { background: var(--butter); }
.notetext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.notetext small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
.notecopy { border: 2px solid var(--ink); background: var(--slide); color: var(--text); border-radius: 999px; padding: 3px 13px; font-size: 12.5px; font-weight: 600; }
.notecopy:hover { background: var(--butter); }
.notetag { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 700; color: var(--ink); }
.notetag::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--ink); margin-right: 6px; }
.notetag:hover { text-decoration: underline; text-underline-offset: 3px; }
.notesempty { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.inlinenote { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.inlinenote input { flex: 1 1 260px; }
.inlinenote select { flex: 0 1 190px; font-weight: 600; padding: 10px 14px; }
.qnadd.inadd { width: auto; margin-top: 0; padding: 10px 20px; }
#allList .notelist { margin-top: 8px; }
#inMsg:empty { display: none; }

/* Narrow screens */
@media (max-width: 900px) {
  .toolslide, .duo { grid-template-columns: minmax(0, 1fr); }
  .titlecard { max-width: 340px; margin: 0 auto; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }

        list0.innerHTML = '';
        if (!NOTES.length) {
          var e = document.createElement('p'); e.className = 'notesempty';
          e.textContent = 'Nothing yet. Your notes will show up here.';
          list0.appendChild(e);
        } else {
          var ul0 = document.createElement('ul'); ul0.className = 'notelist';
          NOTES.slice().reverse().forEach(function (n) { ul0.appendChild(noteItem(n, true)); });
          list0.appendChild(ul0);
        }
      }
    }
    if (!box) return;
    if (!notesOn) { box.hidden = true; return; }
    var t = toolById(box.dataset.tool), list = notesFor(t.id);
    box.hidden = false;
    box.innerHTML = '<div class="noteshead"><h3>Quick notes for ' + esc(t.name) + '</h3><span>Copy a note into the tool, then tick it off.</span></div>';
    if (!list.length) {
      var p = document.createElement('p'); p.className = 'notesempty';
      p.textContent = 'Nothing waiting here. Tap + Quick note any time to add one.';
      box.appendChild(p); return;
    }
    var ul = document.createElement('ul'); ul.className = 'notelist';
    list.forEach(function (n) { ul.appendChild(noteItem(n, false)); });
    box.appendChild(ul);
  }

  function paintNotes() { paintBadges(); paintToolNotes(); }

  function paintChips() {
    qnChips.innerHTML = '';
    var opts = [{ id: 'auto', name: qnSample ? 'Let AI choose' : 'Auto-sort', c: 'var(--butter)' }].concat(TOOLS);
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'qnchip'; b.textContent = o.name;
      b.style.setProperty('--c', o.c);
      b.setAttribute('aria-pressed', String(qnChoice === o.id));
      b.addEventListener('click', function () { qnChoice = o.id; paintChips(); });
      qnChips.appendChild(b);
    });
  }

  function openPanel() { panel.hidden = false; syncFab(); paintChips(); qnText.focus(); }
  function closePanel() { panel.hidden = true; syncFab(); if (!fab.hidden) fab.focus(); }

  function aiPick(text) {
    var list = TOOLS.map(function (t) { return t.id + ': ' + t.name + ' - ' + t.short + ' ' + t.when; }).join('\n');
    var prompt = 'Sort a quick note into ONE of these personal tools. Pick the tool where the note would be most useful.\n\n' +
      list + '\n\nThe note (between the markers):\n<<<' + text + '>>>\n\n' +
      'Reply with only JSON: {"tool": "<one of: ' + TOOLS.map(function (t) { return t.id; }).join(', ') + '>"}';
    return qnSample.json(prompt, { modelTier: 'quick' }).then(function (r) {
      var id = r && String(r.tool);
      if (!toolById(id)) throw { code: 'invalid_json' };
      return id;
    });
  }

  function submitNote(text, choice, ui) {
    text = text.trim();
    if (!text) { ui.focus(); return; }
    if (!choice) { ui.msg.textContent = 'Pick a tool for this note.'; return; }
    ui.busy(true);
    var noPick = { pickMsg: 'Not sure where this one goes. Choose a tool and add it again.' };
    var pick;
    if (choice !== 'auto') pick = Promise.resolve(choice);
    else if (qnSample) {
      ui.msg.textContent = 'Finding the right tool...';
      pick = aiPick(text).catch(function (err) {
        if (AI_OFF.indexOf(err && err.code) >= 0) qnSample = null;
        var id = localSort(text);
        if (id) return id;
        throw noPick;
      });
    } else {
      var id0 = localSort(text);
      pick = id0 ? Promise.resolve(id0) : Promise.reject(noPick);
    }
    pick.then(function (id) {
      return saveNote({ text: text.slice(0, 1000), tool: id, created: Date.now() }).then(function () { return id; });
    }).then(function (id) {
      ui.reset();
      ui.msg.textContent = 'Saved to ' + toolById(id).name + '. ';
      var go = document.createElement('button');
      go.type = 'button'; go.textContent = 'Open';
      go.addEventListener('click', function () { ui.open(id); });
      ui.msg.appendChild(go);
    }).catch(function (e) {
      if (e && e.pickMsg) { ui.noPick(); ui.msg.textContent = e.pickMsg; return; }
      ui.msg.textContent = e && e.code === 'quota_exceeded' ? 'Your notes are full. Tick some off, then try again.' : 'That note did not save. Please try again.';
    }).then(function () { ui.busy(false); });
  }

  function addNote() {
    submitNote(qnText.value, qnChoice, {
      msg: qnMsg,
      focus: function () { qnText.focus(); },
      busy: function (b) { qnAdd.disabled = b; },
      reset: function () { qnText.value = ''; qnChoice = 'auto'; paintChips(); },
      noPick: function () { qnChoice = null; paintChips(); },
      open: function (id) { closePanel(); show(id); }
    });
  }

  // The note box on the Today page, beside the list of notes.
  function setupInline() {
    var form = document.getElementById('inNote');
    if (!form) return;
    var input = document.getElementById('inText'), sel = document.getElementById('inTool'), btn = document.getElementById('inAdd'), msg = document.getElementById('inMsg');
    sel.innerHTML = '';
    [{ id: 'auto', name: qnSample ? 'Let AI choose' : 'Auto-sort' }].concat(TOOLS).forEach(function (o) {
      var op = document.createElement('option'); op.value = o.id; op.textContent = o.name; sel.appendChild(op);
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      submitNote(input.value, sel.value, {
        msg: msg,
        focus: function () { input.focus(); },
        busy: function (b) { btn.disabled = b; },
        reset: function () { input.value = ''; sel.value = 'auto'; },
        noPick: function () { sel.focus(); },
        open: function (id) { show(id); }
      });
    });
  }

  var curPage = 'today';
  function syncFab() { fab.hidden = !notesOn || curPage === 'today' || !panel.hidden; }

  fab.addEventListener('click', openPanel);
  document.getElementById('qnClose').addEventListener('click', closePanel);
  qnAdd.addEventListener('click', addNote);
  qnText.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addNote(); });
  panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  if (window.claude && window.claude.use) {
    Promise.all([
      window.claude.use('db').catch(function () { return null; }),
      window.claude.use('user').catch(function () { return null; }),
      samplePromise
    ]).then(function (r) {
      var db = r[0], user = r[1];
      qnSample = r[2];
      if (!db || !user) return useLocal();
      return Promise.all([user.id(), user.isOwner()]).then(function (v) {
        if (!v[0] || !v[1]) return useLocal();
        notesCol = db.collection('data/users/' + v[0]);
        var first = true;
        notesCol.orderBy('created', 'asc').onSnapshot(function (snap) {
          if (first) { first = false; turnOn('claude'); }
          setNotes(snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }));
        }, function () {
          if (notesMode === 'claude') { notesOn = false; NOTES = []; useLocal(); if (!notesOn) { panel.hidden = true; syncFab(); document.body.classList.remove('hasnotes'); } paintNotes(); }
          else if (first) { first = false; useLocal(); }
        });
      });
    }).catch(function () { if (!notesOn) useLocal(); });
  } else {
    useLocal();
  }

  function renderTool(t, idx) {
    main.innerHTML =
      '<section class="slide toolslide" style="--c:' + t.c + '">' +
        '<div class="titlecard"><span class="dot">' + svg(t.id) + '</span><span class="zone">' + two(idx + 1) + '<span class="sep"> | </span>' + esc(t.zone) + '</span><h1>' + esc(t.name) + '</h1><p>' + esc(t.short) + '</p></div>' +
        '<div><p class="lede tool">' + esc(t.lede) + '</p><ol class="steps">' +
          t.what.map(function (w, i) {
            return '<li><span class="num">' + two(i + 1) + '</span><div class="stepcard"><span class="dot">' + svg(w[0]) + '</span><div><b>' + esc(w[1]) + '</b><span>' + esc(w[2]) + '</span></div></div></li>';
          }).join('') +
        '</ol></div>' +
      '</section>' +
      '<div class="duo">' +
        '<section class="slide openslide"><div class="eyebrow">Full version</div><div class="btnrow"><a class="openbtn" href="https://www.linkedin.com/in/weiweihu/" target="_blank" rel="noopener" title="Weiwei Hu on LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Invite only <i aria-hidden="true">↗</i></a>' + (t.sample ? '<a class="samplebtn" href="' + t.sample + '" target="_blank" rel="noopener">See sample page <i aria-hidden="true">↗</i></a>' : '') + '</div></section>' +
        '<section class="slide whenslide"><h3>When to use it</h3><p>' + esc(t.when) + '</p></section>' +
      '</div>' +
      '<section class="slide notesslide" id="toolNotes" data-tool="' + t.id + '" style="--c:' + t.c + '" hidden></section>';
  }

  function show(page) {
    if (timer) { clearInterval(timer); timer = null; }
    var idx = -1;
    TOOLS.forEach(function (x, i) { if (x.id === page) idx = i; });
    if (idx >= 0) renderTool(TOOLS[idx], idx); else { page = 'today'; renderToday(); }
    Array.prototype.forEach.call(nav.querySelectorAll('.nav'), function (b) {
      if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    curPage = page; if (!panel.hidden && page === 'today') panel.hidden = true;
    syncFab(); paintNotes();
    try { localStorage.setItem('wb-page', page); } catch (e) {}
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-page]');
    if (el) show(el.dataset.page);
  });
  document.addEventListener('keydown', function (e) {
    var el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('class') === 'stop') {
      e.preventDefault();
      show(el.getAttribute('data-page'));
    }
  });

  var first = (location.hash || '').slice(1);
  if (!first) { try { first = localStorage.getItem('wb-page') || ''; } catch (e) {} }
  show(first || 'today');
})();
</script>

</body>
